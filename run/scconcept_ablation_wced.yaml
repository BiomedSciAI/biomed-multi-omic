defaults:
  - tokenizer: protein_coding
  - model: llama_scconcept
  - task: scconcept
  - trainer: scconcept_base
  - data_module: scconcept_base
  - fields: scconcept_wced
  - panel_sampler: per_cell
  - _self_

seed:
  seed_value: 1234

label_columns: []

data_module:
  mlm: true
  n_views: 1                    # single input view (spec §3.5 / §6)
  use_condition_sampler: false  # DECLARED difference (spec §6): plain shuffle

trainer:
  # WCED loss shape (spec §2.1/§6): input_genes(1) + non_input_genes(1) + all_genes(0 metric)
  losses:
    - field_name: expressions
      name: mse
      ignore_zero: true
      wced_target: input_genes
      weight: 1.0
    - field_name: expressions
      name: is_zero_bce
      wced_target: input_genes
      weight: 1.0
    - field_name: expressions
      name: mse
      ignore_zero: true
      wced_target: non_input_genes
      weight: 1.0
    - field_name: expressions
      name: is_zero_bce
      wced_target: non_input_genes
      weight: 1.0
    - field_name: expressions
      name: mse
      ignore_zero: true
      wced_target: all_genes
      weight: 0.0
    - field_name: expressions
      name: is_zero_bce
      wced_target: all_genes
      weight: 0.0

track_clearml:
  project_name: bmfm-targets/scconcept_ablation
  task_name: scconcept_ablation_wced
  continue_last_task: false

n_cells_per_batch: 64
