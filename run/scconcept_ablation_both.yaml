defaults:
  - tokenizer: protein_coding
  - model: llama_scconcept
  - task: scconcept
  - trainer: scconcept_base
  - data_module: scconcept_base
  - fields: scconcept_both
  - panel_sampler: default
  - _self_

seed:
  seed_value: 1234

label_columns: []

data_module:
  mlm: true
  n_views: 2
  use_condition_sampler: true

trainer:
  # WCED loss shape (spec §2.1/§6) + contrastive(1)
  losses:
    - field_name: expressions
      name: mse
      ignore_zero: true
      wced_target: input_genes
      weight: 1.0
    - field_name: expressions
      name: is_zero_bce
      wced_target: input_genes
      weight: 1.0
    - field_name: expressions
      name: mse
      ignore_zero: true
      wced_target: non_input_genes
      weight: 1.0
    - field_name: expressions
      name: is_zero_bce
      wced_target: non_input_genes
      weight: 1.0
    - field_name: expressions
      name: mse
      ignore_zero: true
      wced_target: all_genes
      weight: 0.0
    - field_name: expressions
      name: is_zero_bce
      wced_target: all_genes
      weight: 0.0
    - field_name: expressions
      name: contrastive
      both_batch: true
      weight: 1.0

track_clearml:
  project_name: bmfm-targets/scconcept_ablation
  task_name: scconcept_ablation_both
  continue_last_task: false

n_cells_per_batch: 64
