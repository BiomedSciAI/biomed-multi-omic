defaults:
  - tokenizer: protein_coding
  - model: llama_scconcept
  - task: scconcept
  - trainer: scconcept_base
  - data_module: scconcept_base
  - fields: scconcept_contrastive
  - panel_sampler: per_cell
  - _self_

seed:
  seed_value: 1234

label_columns: []

data_module:
  mlm: false
  # No masker for the contrastive arm: it decodes from [CLS] only and never uses
  # per-gene labels. The shared base sets WCEDMasker, but data_module.py attaches
  # it whenever it is a WCEDMasker regardless of `mlm`, so leaving it would build
  # the full ~19k-gene WCED label every batch (wasted compute, ~as slow as `both`).
  # Overriding to null → self.masker = None (mlm:false else-branch).
  masking_strategy: null
  n_views: 2
  use_condition_sampler: true
  # No WCED label here, so real zeros aren't needed → expose_zeros null keeps the
  # dataloader fast (no ~19k densify), matching the working July-3 contrastive run.
  dataset_kwargs:
    expose_zeros: null

trainer:
  losses:
    - field_name: expressions
      name: contrastive
      both_batch: true
      weight: 1.0

track_clearml:
  project_name: bmfm-targets/scconcept_ablation
  task_name: scconcept_ablation_contrastive
  continue_last_task: false

n_cells_per_batch: 64
