# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Install the latest version of uv and set the python version
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install cURL Headers (for hic-straw install/build)
      run: sudo apt-get update && sudo apt-get install libcurl4-openssl-dev
    - name: Install python build/environment requirements
      run: uv pip install -q pip wheel pytest-cov nbqa pylint
    - name: Install package
      run: uv pip install -q .[bulk_rna,benchmarking,test,notebook]
    - name: Cache L1000 gene info (avoids hitting NCBI on every run)
      id: l1000-cache
      uses: actions/cache@v4
      with:
        path: bmfm_targets/tokenization/resources/GSE70138_Broad_LINCS_gene_info_2017-03-06.txt
        key: l1000-gene-info-GSE70138-2017-03-06
    - name: Report L1000 cache status
      run: |
        echo "cache-hit=${{ steps.l1000-cache.outputs.cache-hit }}"
        f=bmfm_targets/tokenization/resources/GSE70138_Broad_LINCS_gene_info_2017-03-06.txt
        if [ -f "$f" ]; then sha256sum "$f"; wc -l "$f"; else echo "L1000 file not present"; fi
        echo "### L1000 cache hit: \`${{ steps.l1000-cache.outputs.cache-hit || 'false' }}\`" >> "$GITHUB_STEP_SUMMARY"
    - name: Print environment
      run: uv pip freeze
    - name: Test package import
      run: pushd /tmp; python -c "import bmfm_targets"; popd;
    - name: Run package tests
      env:
        # After a cache hit the file must come from the cache; fail instead of
        # silently falling back to a download.
        BMFM_TARGETS_L1000_OFFLINE: ${{ steps.l1000-cache.outputs.cache-hit == 'true' && '1' || '' }}
      run: python -m pytest -v --durations=40 bmfm_targets/tests/
